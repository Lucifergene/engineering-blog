baseURL = "https://lucifergene.github.io/systems-in-practice/"
locale = "en-us"
defaultContentLanguage = "en"
title = "Systems in Practice"
theme = "hugo-blog-awesome"
enableRobotsTXT = true

[pagination]
  pagerSize = 20

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

[params]
  sitename = "Systems in Practice"
  description = "Architecture, debugging, and hard-earned lessons from the systems I build."
  defaultColor = "dark"
  mainSections = ["posts"]
  toc = true
  tocOpen = false
  goToTop = true
  dateFormat = "2 Jan 2006"
  rssFeedDescription = "summary"

  [params.author]
    avatar = "images/avik-eiffel.jpg"
    name = "Portrait of the author"
    intro = "Systems in Practice"
    description = "Architecture, debugging, and hard-earned lessons from the systems I build."

  [params.webmanifest]
    name = "Systems in Practice"
    short_name = "Systems in Practice"
    theme_color = "#434648"
    background_color = "#ffffff"
    display = "standalone"

[menus]
  [[menus.main]]
    name = "Home"
    pageRef = "/"
    weight = 10

  [[menus.main]]
    name = "Posts"
    pageRef = "/posts"
    weight = 20

  [[menus.main]]
    name = "About"
    url = "https://avikkundu.com"
    weight = 30
